name: Deploy web to FTP

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # FTP-Deploy-Action downloads its sync state with a PASV data connection.
            # When the state file does not exist yet (first publish, empty server-dir) the
            # server answers 550 and resets that data socket, basic-ftp then marks the client
            # as closed and the first "MKD" fails with "Client is closed because read
            # ECONNRESET (data socket)". Seeding an empty state file avoids that code path.
            # See SamKirkland/ftp-deploy#37 and SamKirkland/FTP-Deploy-Action#489.
            - name: Seed deploy state on first publish
              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  set -euo pipefail
                  # Plain FTP on purpose: the deploy action below also connects without TLS,
                  # so the check must use the same transport rather than trip over a shared
                  # hosting certificate that does not match the FTP hostname.
                  state_url="ftp://$FTP_SERVER/.ftp-deploy-sync-state.json"
                  curl_log="$RUNNER_TEMP/ftp-state-check.log"
                  status=0
                  curl --silent --show-error --user "$FTP_USERNAME:$FTP_PASSWORD" -o /dev/null "$state_url" 2> "$curl_log" || status=$?

                  if [ "$status" -eq 0 ]; then
                      echo "Deploy state exists on the server, nothing to seed."
                      exit 0
                  fi
                  if [ "$status" -ne 78 ]; then
                      echo "Could not read the deploy state from the server (curl exit $status):" >&2
                      cat "$curl_log" >&2
                      exit "$status"
                  fi

                  echo "No deploy state on the server, seeding an empty one so the first publish can run."
                  state_file="$RUNNER_TEMP/ftp-deploy-sync-state.json"
                  printf '{"description":"DO NOT DELETE THIS FILE. Seeded by the deploy workflow so the first publish can run.","version":"1.0.0","generatedTime":%s,"data":[]}\n' \
                      "$(date +%s)000" > "$state_file"
                  curl --silent --show-error --fail --user "$FTP_USERNAME:$FTP_PASSWORD" \
                      --upload-file "$state_file" "$state_url"
                  echo "Deploy state seeded."

            - name: Upload docs directory to FTP root
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ./docs/
                  server-dir: ./
                  timeout: 120000
                  exclude: |
                      **/.git*
                      **/.git*/
                      **/.DS_Store
                      **/.ftp-deploy-sync-state.json
